version: "3.8"

services:

  db:
    image: postgres:15
    container_name: pir-db
    restart: always
    environment:
      POSTGRES_DB: pirs_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: pir-backend
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pirs_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  frontend:
    build: ./frontend
    container_name: pir-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"